version: v0.4
project:
  name: percolation-after-anthropic
  description: Lean 4/Mathlib proofs of the Kozma-Nitzan connection inequalities for Bernoulli bond percolation
    on Z^d and their extension to independent hyperedges (hypergraph percolation) and to site percolation,
    building on the bond-percolation proof of Anthropic. The development includes affirmative answers
    to several Kozma-Nitzan questions and a counterexample to the every-minimizer reading of Question
    8.
  authors:
  - Ahmed Bou-Rabee
  - Justin Leder
  responsible_maintainers:
  - Justin Leder
  license: Apache-2.0
