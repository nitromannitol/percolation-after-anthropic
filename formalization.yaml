  type: original-proof
  relationship: other
  note: 'The hypergraph and site-percolation extension and the counterexample to the every-minimizer reading
    of Question 8 are first presented by this formalization. The Kozma-Nitzan results are written up in
    docs/kn-results.tex. TODO(author): record the identifier of an accompanying write-up of the extension.'
