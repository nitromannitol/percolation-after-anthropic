automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "Claude Sonnet 5"
        - "Claude Opus 5"
        - "DeepSeek v4.1 Flash"
      framework: >-
        Claude Code (Anthropic) and the Pi agent harness, directing the models above; the author
        supervised the work and is responsible for the formalization.
      tool_setup: >-
        Lake builds under the pinned Lean toolchain and Mathlib revision. The CI workflow rejects
        any use of sorry and checks the axiom reports, and the comparator workflow runs the
        Mathlib-only comparator challenge/solution pair against leanprover/comparator, lean4export,
        nanoda and landrun at the revisions recorded in .github/workflows/.
      cost:
        spend_usd: "not separately tracked (subscription and API accounts)"
        hardware: "one Ubuntu workstation"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author. Statement differences from the
        paper are disclosed under fidelity.
fidelity:
  divergences: Question 8 is formalized in its every-minimizer reading (Question8EveryMin in KNConjectures/Question8Defs.lean),
    which is refuted by KNAll.not_question8EveryMin; the printed question does not say which minimizer is
    meant when the minimum is attained more than once, and the every-minimizer tie is recorded as a genuine
    divergence. The Lean statement of Question 5 has the right-hand side P(o <-> b) printed
    by Kozma and Nitzan, and the sharper right-hand side P(o <-> b, o <-> A) and the positive result for
    Question 8 when |A| <= 2 are proved in docs/kn-results.tex only. The formal Conjecture 3 quantifies over
    the empty set A as well, and the formal Conjecture 6 also covers the degenerate pair v = w. VERIFICATION.md
    records the review and the reproducible checks.
review:
  status: in-progress
  reviewers:
  - Ahmed Bou-Rabee
  notes: The review and reproducible checks are recorded in VERIFICATION.md. Not external peer
    review.
alignment:
  namespace: KNAll
  statements:
  - source: Headline theorem (site percolation on Z^d, d >= 3, has no infinite open cluster at criticality)
    lean: KNAll.Site.site_no_percolation_at_critical
    module: Hypergraph.FinalCriticality
    status: proved
    note: The only arguments are the dimension d and 3 <= d.
  - source: Finite connection inequality for independent labelled hyperedges
    lean: KNAll.Site.FiniteHyperGluingClosed.hyperedgeGluing
    module: Hypergraph.FiniteHyperGluingClosed
    status: proved
    note: ''
  - source: Kozma-Nitzan Conjecture 1 (arXiv:2401.12397, p. 3)
    lean: KNAll.conjecture1_holds
    module: KNConjectures.Conjectures
    status: proved
    note: A second derivation from the bond-percolation proof of the dependency is KN1Corollary.kozmaNitzan_conjecture1.
  - source: Kozma-Nitzan Conjecture 2 (arXiv:2401.12397, p. 3) and its strong form
    lean: KNAll.conjecture2_holds, KNAll.conjecture2Strong_holds
    module: KNConjectures.Conjectures
    status: proved
    note: ''
  - source: Kozma-Nitzan Conjecture 3
    lean: KNAll.conjecture3_holds
    module: KNConjectures.Conjectures
    status: proved
    note: Derived from Conjecture 1; the dependency states it as Percolation.Literature.KozmaNitzan2024_conjecture3.
  - source: Kozma-Nitzan Conjecture 4 (arXiv:2401.12397, p. 32)
    lean: KNAll.conjecture4_holds, KNAll.conjecture4Fixed_holds, KNAll.conjecture4_clusterProperty_holds
    module: KNConjectures.Conjectures
    status: proved
    note: The fixed-minimizer form is stronger than the printed statement.
  - source: Kozma-Nitzan Conjecture 6 (arXiv:2401.12397, p. 34)
    lean: KNAll.Guarded.conjecture6_holds, KNAll.Guarded.conjecture6Strong_holds
    module: KNConjectures.Conjecture6Proof
    status: proved
    note: The strong form needs no hypothesis on the endpoints.
  - source: Kozma-Nitzan Question 5
    lean: KNAll.question5_holds
    module: KNConjectures.Question5
    status: proved
    note: The right-hand side is the printed P(o <-> b).
  - source: Kozma-Nitzan Question 7 (arXiv:2401.12397, p. 36, display (41))
    lean: KNAll.question7_holds
    module: KNConjectures.Conjectures
    status: proved
    note: ''
  - source: Kozma-Nitzan Question 8, every-minimizer reading
    lean: KNAll.not_question8EveryMin
    module: KNConjectures.Question8Counterexample
    status: proved
    note: Proves the negation of the every-minimizer reading; the strict-minimizer reading is not decided.
  - source: Kozma-Nitzan Question 9 (arXiv:2401.12397, p. 36)
    lean: KNAll.question9_holds
    module: KNConjectures.Question9
    status: proved
    note: Obtained from KNAll.setSourceFixedMin_holds.
